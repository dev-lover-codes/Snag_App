name: Flutter Android Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.5.0). Defaults to v<pubspec version> if left empty.'
        required: false
        default: ''
      draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Publish as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Grant execute permission for Gradle wrapper
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run code analysis
        run: flutter analyze --no-fatal-infos

      - name: Run automated tests
        run: flutter test

      - name: Resolve Release Tag & Version
        id: vars
        run: |
          PUBSPEC_VERSION=$(grep '^version: ' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1 | tr -d '[:space:]')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v$PUBSPEC_VERSION"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PUBSPEC_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved Tag: $TAG_NAME (Version: $PUBSPEC_VERSION)"

      - name: Build Android Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          DART_DEFINES=""
          if [ -n "$SUPABASE_URL" ]; then
            echo "Injecting SUPABASE_URL from repository secrets"
            DART_DEFINES="$DART_DEFINES --dart-define=SUPABASE_URL=$SUPABASE_URL"
          else
            echo "Warning: SUPABASE_URL secret is not set"
          fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "Injecting SUPABASE_ANON_KEY from repository secrets"
            DART_DEFINES="$DART_DEFINES --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          else
            echo "Warning: SUPABASE_ANON_KEY secret is not set"
          fi
          flutter build apk --release $DART_DEFINES

      - name: Prepare Release APK
        id: artifacts
        run: |
          TAG="${{ steps.vars.outputs.tag_name }}"
          SRC_APK="build/app/outputs/flutter-apk/app-release.apk"
          DEST_APK="snag-${TAG}.apk"

          if [ ! -f "$SRC_APK" ]; then
            echo "Error: Expected APK file not found at $SRC_APK"
            exit 1
          fi

          cp "$SRC_APK" "$DEST_APK"
          echo "apk_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "Release APK prepared: $DEST_APK"
          ls -lh "$DEST_APK"

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snag-${{ steps.vars.outputs.tag_name }}-apk
          path: ${{ steps.artifacts.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: Snag ${{ steps.vars.outputs.tag_name }}
          files: ${{ steps.artifacts.outputs.apk_path }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
